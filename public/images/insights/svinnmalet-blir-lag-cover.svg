<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Svinnmålet blir lag — abstrakt visualisering</title>
  <desc id="d">Stor text minus 30 procent. En tidslinje från basåren 2021 till 2023, via idag, till målåret 2030.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#010D60"/><stop offset="50%" stop-color="#1A277A"/><stop offset="100%" stop-color="#010D60"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.6" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <text x="240" y="110" font-family="'Chakra Petch', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#90A2CF" letter-spacing="0.12em">RÄTT VARA, RÄTT MÄNGD · DEL 2 AV 3</text>
  <text x="800" y="430" font-family="'Chakra Petch', 'Helvetica Neue', Arial, sans-serif" font-size="270" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.01em">−30 %</text>
  <text x="800" y="500" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-style="italic" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">matsvinn per capita i handel och konsumtion</text>
  <line x1="240" y1="640" x2="1350" y2="640" stroke="#90A2CF" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="240" y="610" width="380" height="60" rx="4" fill="#2d8a6b" fill-opacity="0.9"/>
  <text x="430" y="649" font-family="'Chakra Petch', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.08em">BASÅR 2021–2023</text>
  <circle cx="880" cy="640" r="10" fill="#FFFFFF"/>
  <text x="880" y="600" font-family="'Chakra Petch', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#90A2CF" text-anchor="middle" letter-spacing="0.1em">IDAG</text>
  <rect x="1130" y="610" width="200" height="60" rx="4" fill="none" stroke="#4FB3A0" stroke-width="3"/>
  <text x="1230" y="651" font-family="'Chakra Petch', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#4FB3A0" text-anchor="middle" letter-spacing="0.08em">2030</text>
  <polygon points="1338,626 1360,640 1338,654" fill="#4FB3A0"/>
  <text x="240" y="810" font-family="'Source Serif 4', Georgia, serif" font-size="24" font-style="italic" fill="#FFFFFF" fill-opacity="0.65">EU:s mål är bindande. Basåret har redan passerat.</text>
</svg>
